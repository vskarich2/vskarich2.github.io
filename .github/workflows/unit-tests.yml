name: Validate site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Check formatting
        run: npm run lint:prettier
      - name: Check al-folio compatibility
        run: bundle exec al-folio upgrade audit --no-fail
      - name: Build site
        run: JEKYLL_ENV=production bundle exec jekyll build
      - name: Check required routes
        run: |
          test -f _site/index.html
          test -f _site/research/index.html
          test -f _site/publications/index.html
          test -f _site/projects/index.html
          test -f _site/cv/index.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml
